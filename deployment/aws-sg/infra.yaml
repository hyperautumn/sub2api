AWSTemplateFormatVersion: '2010-09-09'
Description: Sub2API Singapore single-node production baseline with a reserved second AZ

Parameters:
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  PostgresVersion:
    Type: String
    Default: '18.6'
  ValkeyVersion:
    Type: String
    Default: '8.2'
  AllowAdminBootstrap:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  PublicApiDomain:
    Type: String
    Default: ''
  PublicApiZoneId:
    Type: String
    Default: ''
  PublicApiCertificateArn:
    Type: String
    Default: ''

Conditions:
  AdminBootstrap: !Equals [!Ref AllowAdminBootstrap, 'true']
  PublicApiEnabled: !And
    - !Not [!Equals [!Ref PublicApiDomain, '']]
    - !Not [!Equals [!Ref PublicApiZoneId, '']]
    - !Not [!Equals [!Ref PublicApiCertificateArn, '']]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Ref 'AWS::StackName'}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.10.0.0/24
      Tags: [{Key: Name, Value: sub2api-public-a}]
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.10.1.0/24
      Tags: [{Key: Name, Value: sub2api-public-b}]
  AppA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !GetAtt PublicA.AvailabilityZone
      CidrBlock: 10.10.10.0/24
      Tags: [{Key: Name, Value: sub2api-app-a}]
  AppB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !GetAtt PublicB.AvailabilityZone
      CidrBlock: 10.10.11.0/24
      Tags: [{Key: Name, Value: sub2api-app-b}]
  DataA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !GetAtt PublicA.AvailabilityZone
      CidrBlock: 10.10.20.0/24
      Tags: [{Key: Name, Value: sub2api-data-a}]
  DataB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !GetAtt PublicB.AvailabilityZone
      CidrBlock: 10.10.21.0/24
      Tags: [{Key: Name, Value: sub2api-data-b}]
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRoutes, SubnetId: !Ref PublicA}
  PublicBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRoutes, SubnetId: !Ref PublicB}
  NatAEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  NatA:
    Type: AWS::EC2::NatGateway
    DependsOn: [InternetAttachment, PublicARoutes, PublicDefaultRoute]
    Properties:
      AllocationId: !GetAtt NatAEip.AllocationId
      SubnetId: !Ref PublicA
  AppRoutesA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  AppRoutesB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  AppDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRoutesA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatA
  AppARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref AppRoutesA, SubnetId: !Ref AppA}
  AppBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref AppRoutesB, SubnetId: !Ref AppB}
  DataRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DataARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref DataRoutes, SubnetId: !Ref DataA}
  DataBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref DataRoutes, SubnetId: !Ref DataB}
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: [!Ref AppRoutesA, !Ref AppRoutesB]

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Sub2API public ALB
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 10.10.10.0/23}
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Sub2API application
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Sub2API private PostgreSQL
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSg}
  CacheSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Sub2API private Valkey
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref AppSg}
  AppToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSg
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DbSg
  AppToCache:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSg
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      DestinationSecurityGroupId: !Ref CacheSg

  AppDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/app-db'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"sub2api"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
  CacheSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/valkey'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/jwt'
      GenerateSecretString:
        PasswordLength: 64
        ExcludeUppercase: true
        ExcludePunctuation: true
        ExcludeCharacters: ghijklmnopqrstuvwxyz
        RequireEachIncludedType: false
  TotpSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/totp'
      GenerateSecretString:
        PasswordLength: 64
        ExcludeUppercase: true
        ExcludePunctuation: true
        ExcludeCharacters: ghijklmnopqrstuvwxyz
        RequireEachIncludedType: false
  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/bootstrap-admin'
      GenerateSecretString:
        SecretStringTemplate: '{"email":"admin@sub2api.invalid"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Sub2API data subnets in both AZs
      SubnetIds: [!Ref DataA, !Ref DataB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-pg'
      Engine: postgres
      EngineVersion: !Ref PostgresVersion
      DBInstanceClass: db.t4g.small
      AllocatedStorage: '100'
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      AvailabilityZone: !GetAtt DataA.AvailabilityZone
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSg]
      DBName: sub2api
      MasterUsername: sub2api_admin
      ManageMasterUserPassword: true
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      CACertificateIdentifier: rds-ca-rsa2048-g1
  CacheSubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Sub2API data subnets in both AZs
      SubnetIds: [!Ref DataA, !Ref DataB]
  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub '${AWS::StackName}-kv'
      ReplicationGroupDescription: Sub2API Valkey
      Engine: valkey
      EngineVersion: !Ref ValkeyVersion
      CacheNodeType: cache.t4g.micro
      CacheSubnetGroupName: !Ref CacheSubnets
      SecurityGroupIds: [!Ref CacheSg]
      PreferredCacheClusterAZs: [!GetAtt DataA.AvailabilityZone]
      Port: 6379
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      MultiAZEnabled: false
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      TransitEncryptionMode: required
      AuthToken: !Sub '{{resolve:secretsmanager:${CacheSecret}:SecretString:password}}'
  StorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: NoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
  StorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt StorageBucket.Arn, !Sub '${StorageBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  ApplicationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/sub2api/${AWS::StackName}/app'
      RetentionInDays: 30
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: ReadAppSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppDbSecret
                  - !Ref CacheSecret
                  - !Ref JwtSecret
                  - !Ref TotpSecret
                  - !If [AdminBootstrap, !Ref AdminSecret, !Ref 'AWS::NoValue']
        - PolicyName: ApplicationLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApplicationLogs.Arn
  AppProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppRole]
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref UbuntuAmi
        InstanceType: t3.medium
        IamInstanceProfile:
          Arn: !GetAtt AppProfile.Arn
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 50
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        CreditSpecification: {CpuCredits: standard}
  AppInstanceA:
    Type: AWS::EC2::Instance
    DependsOn: [AppDefaultRouteA, AppARoutes]
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref AppA
          GroupSet: [!Ref AppSg]
          PrivateIpAddress: 10.10.10.11
          AssociatePublicIpAddress: false
          DeleteOnTermination: true
      Tags: [{Key: Name, Value: sub2api-app-01}]

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: [InternetAttachment, PublicARoutes, PublicBRoutes, PublicDefaultRoute]
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '1800'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  ProdTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: instance
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 20
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '1800'}
      Targets: [{Id: !Ref AppInstanceA, Port: 8080}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: Use the configured HTTPS domain or the SSM tunnel.
  HttpHealthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: [/health]
      Actions:
        - {Type: forward, TargetGroupArn: !Ref ProdTargets}
  PublicApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: PublicApiEnabled
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref PublicApiCertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: Not found.
  PublicApiReadRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: PublicApiEnabled
    Properties:
      ListenerArn: !Ref PublicApiListener
      Priority: 10
      Conditions:
        - {Field: host-header, Values: [!Ref PublicApiDomain]}
        - {Field: path-pattern, Values: [/health, /v1/models, /v1/responses]}
        - Field: http-request-method
          HttpRequestMethodConfig: {Values: [GET]}
      Actions:
        - {Type: forward, TargetGroupArn: !Ref ProdTargets}
  PublicApiResponsesRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: PublicApiEnabled
    Properties:
      ListenerArn: !Ref PublicApiListener
      Priority: 20
      Conditions:
        - {Field: host-header, Values: [!Ref PublicApiDomain]}
        - {Field: path-pattern, Values: [/v1/responses, /v1/responses/compact, /v1/responses/input_tokens]}
        - Field: http-request-method
          HttpRequestMethodConfig: {Values: [POST]}
      Actions:
        - {Type: forward, TargetGroupArn: !Ref ProdTargets}
  PublicApiMessagesRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: PublicApiEnabled
    Properties:
      ListenerArn: !Ref PublicApiListener
      Priority: 30
      Conditions:
        - {Field: host-header, Values: [!Ref PublicApiDomain]}
        - {Field: path-pattern, Values: [/v1/chat/completions, /v1/messages, /v1/messages/count_tokens]}
        - Field: http-request-method
          HttpRequestMethodConfig: {Values: [POST]}
      Actions:
        - {Type: forward, TargetGroupArn: !Ref ProdTargets}
  PublicApiRecord:
    Type: AWS::Route53::RecordSet
    Condition: PublicApiEnabled
    DependsOn: [PublicApiReadRule, PublicApiResponsesRule, PublicApiMessagesRule]
    Properties:
      HostedZoneId: !Ref PublicApiZoneId
      Name: !Sub '${PublicApiDomain}.'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID
        EvaluateTargetHealth: false
  PublicAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-web'
        SampledRequestsEnabled: false
      Rules:
        - Name: BasicRateLimit
          Priority: 0
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 2000
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-rate'
            SampledRequestsEnabled: false
  AlbAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt PublicAcl.Arn
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sub2API EC2 sustained CPU utilization
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref AppInstanceA}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 75
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  TargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sub2API ALB has no healthy target
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt ProdTargets.TargetGroupFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sub2API database has less than 20 GiB free
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref Database}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 21474836480
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

Outputs:
  AppInstanceId:
    Value: !Ref AppInstanceA
  VpcId:
    Value: !Ref Vpc
  AppSubnetB:
    Value: !Ref AppB
  AppRouteTableB:
    Value: !Ref AppRoutesB
  PublicSubnetB:
    Value: !Ref PublicB
  DataSubnetB:
    Value: !Ref DataB
  NatPublicIp:
    Value: !Ref NatAEip
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  AlbArn:
    Value: !Ref Alb
  ProductionTargetGroup:
    Value: !Ref ProdTargets
  DatabaseHost:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseMasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  ApplicationAdminSecretArn:
    Value: !Ref AdminSecret
  StorageBucketName:
    Value: !Ref StorageBucket
  PublicApiBaseUrl:
    Condition: PublicApiEnabled
    Value: !Sub 'https://${PublicApiDomain}/v1'
